[project]
name = "receiptsort"
version = "0.1.0"
description = "Local-first receipt & invoice sorter powered by open-weight vision models (Ollama)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pillow"]

[project.scripts]
receiptsort = "receiptsort.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["receiptsort"]
